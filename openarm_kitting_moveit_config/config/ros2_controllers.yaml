controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: position_controllers/GripperActionController
    right_gripper_controller:
      type: position_controllers/GripperActionController

left_arm_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    # done only once the arm is really there: the simulated drives settle a little after the last point, and the
    # hand must not open (or close) before then
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      openarm_left_joint1: {goal: 0.01}
      openarm_left_joint2: {goal: 0.01}
      openarm_left_joint3: {goal: 0.01}
      openarm_left_joint4: {goal: 0.01}
      openarm_left_joint5: {goal: 0.01}
      openarm_left_joint6: {goal: 0.02}             # wrist
      openarm_left_joint7: {goal: 0.02}             # wrist

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    allow_stalling: true
    stall_timeout: 0.5
    stall_velocity_threshold: 0.05      # rad/s: fingers squeezing a part still jitter a little in simulation
    goal_tolerance: 0.01

right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    # done only once the arm is really there: the simulated drives settle a little after the last point, and the
    # hand must not open (or close) before then
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.05
      openarm_right_joint1: {goal: 0.01}
      openarm_right_joint2: {goal: 0.01}
      openarm_right_joint3: {goal: 0.01}
      openarm_right_joint4: {goal: 0.01}
      openarm_right_joint5: {goal: 0.01}
      openarm_right_joint6: {goal: 0.02}             # wrist
      openarm_right_joint7: {goal: 0.02}             # wrist

right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
    allow_stalling: true
    stall_timeout: 0.5
    stall_velocity_threshold: 0.05      # rad/s: fingers squeezing a part still jitter a little in simulation
    goal_tolerance: 0.01
