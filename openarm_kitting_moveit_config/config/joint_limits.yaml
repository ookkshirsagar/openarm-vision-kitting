# MoveIt joint limits for the OpenArm 2.0 bench (from
# openarm_bimanual_moveit_config/config/openarm_v2.0/joint_limits.yaml with acceleration caps).
#
# Why: the robot stands in a notch at the rear of a tall table. Fast forward arm accelerations push
# the robot backwards at shoulder height (~1.3 m above the floor) and can rock the table about its
# rear feet. Estimated static margin without anchors: ~125 N of backward push at ~1.1 m.
# These caps keep each arm's centre-of-mass acceleration below ~0.5 g (J1/J2: 16 rad/s^2 at ~0.3 m),
# i.e. under ~30 N per arm even at acceleration scaling 1.0.
#
# The finger joints get an acceleration limit too: Pilz needs one for every joint it plans.
default_velocity_scaling_factor: 0.1
default_acceleration_scaling_factor: 0.1
joint_limits:
  openarm_left_finger_joint1:
    has_velocity_limits: true
    max_velocity: 10.0
    has_acceleration_limits: true
    max_acceleration: 10.0
  openarm_left_joint1:
    has_velocity_limits: true
    max_velocity: 16.754666
    has_acceleration_limits: true
    max_acceleration: 16.0
  openarm_left_joint2:
    has_velocity_limits: true
    max_velocity: 16.754666
    has_acceleration_limits: true
    max_acceleration: 16.0
  openarm_left_joint3:
